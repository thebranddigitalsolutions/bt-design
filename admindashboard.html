  <h3>Uploaded Images</h3>
  <div id="adminGallery" style="display: flex; flex-wrap: wrap; gap: 1rem;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
const CLOUD_NAME = "dwdexzex6";
const UPLOAD_PRESET = "boilertech_upload";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCr1BTBdROX6hPbTvbxH3hQd-W6PpQRDDw",
  authDomain: "boilertech-272dd.firebaseapp.com",
  projectId: "boilertech-272dd",
storageBucket: "boilertech-272dd.appspot.com",
  messagingSenderId: "609150312510",
  appId: "1:609150312510:web:6bc92d05845ae08a07316f",
  measurementId: "G-CNXRVEQ9YG"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {

  if (!user) {
    window.location.href = "admin.html";
  }

});

async function uploadImage() {

  const file = document.getElementById('imageInput').files[0];
  const title = document.getElementById('titleInput').value.trim();
  const description = document.getElementById('descInput').value.trim();

  if (!file || !title || !description) {
    alert("Fill all fields");
    return;
  }

  const formData = new FormData();

  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);
  formData.append("folder", "boilertech/blogs");

  try {

    const response = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      {
        method: "POST",
        body: formData
      }
    );

    const data = await response.json();

    await addDoc(collection(db, "blogs"), {
      url: data.secure_url,
      title,
      description,
      createdAt: new Date()
    });

    alert("Upload Successful");

    document.getElementById('titleInput').value = '';
    document.getElementById('descInput').value = '';
    document.getElementById('imageInput').value = '';

    loadAdminGallery();

  } catch (error) {

    console.error(error);
    alert("Upload Failed");

  }

}



async function loadAdminGallery() {

  const container = document.getElementById('adminGallery');

  container.innerHTML = "Loading...";

  const querySnapshot = await getDocs(collection(db, "blogs"));

  container.innerHTML = "";

  querySnapshot.forEach((docSnap) => {

    const image = docSnap.data();

    const div = document.createElement('div');

    div.className = "image-card";

    div.innerHTML = `
      <img src="${image.url}">
      <strong>${image.title}</strong><br>
      <small>${image.description}</small><br>

      <button class="delete-btn">
        Delete
      </button>
    `;

    container.appendChild(div);

    div
      .querySelector(".delete-btn")
      .addEventListener("click", () => {
        deleteImage(docSnap.id);
      });

  });

}

async function deleteImage(id) {

  if (!confirm("Delete this image?")) return;

  await deleteDoc(doc(db, "blogs", id));

  alert("Deleted");

  loadAdminGallery();

}

document
  .getElementById("uploadBtn")
  .addEventListener("click", uploadImage);

// Initial load
loadAdminGallery();</script>
